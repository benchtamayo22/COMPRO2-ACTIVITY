<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>HTML Form with Thymeleaf</title>
</head>
<body>
<h2>Fill the Form</h2>
<form action="/submitForm" method="post">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required><br>

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob" required><br>

    <label for="age">Age:</label>
    <input type="number" id="age" name="age"><br>

    <label for="gender">Gender:</label>
    <select id="gender" name="gender">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
    </select><br>

    <label for="country">Country:</label>
    <select id="country" name="country">
        <option value="USA">USA</option>
        <option value="Canada">Canada</option>
        <option value="UK">UK</option>
        <option value="Australia">Australia</option>
        <option value="Other">Other</option>
    </select><br>

    <label>Interests:</label><br>
    <input type="checkbox" id="sports" name="interests" value="Sports"> <label for="sports">Sports</label><br>
    <input type="checkbox" id="music" name="interests" value="Music"> <label for="music">Music</label><br>
    <input type="checkbox" id="reading" name="interests" value="Reading"> <label for="reading">Reading</label><br>

    <label for="comments">Comments:</label>
    <textarea id="comments" name="comments"></textarea><br>

    <input type="submit" value="Submit">
</form>
</body>
</html>
